# SmartPresensi - Konfigurasi Nginx untuk server headless (Linux).
#
# Path default: /var/www/smartpresensi
# `deploy/linux/install.sh` menyesuaikan root, port, server_name, dan socket
# PHP-FPM secara otomatis. Bila disalin manual, sesuaikan nilainya lebih dulu.
#
# Pasang:
#   sudo cp deploy/linux/nginx/smartpresensi.conf /etc/nginx/sites-available/smartpresensi.conf
#   sudo ln -sf /etc/nginx/sites-available/smartpresensi.conf /etc/nginx/sites-enabled/smartpresensi.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/smartpresensi/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
