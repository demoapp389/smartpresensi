# ---------------------------------------------------------------------------
# SmartPresensi - Apache HTTP Server (portable)
# Nilai __*__ diganti otomatis oleh setup.ps1 saat instalasi.
# ---------------------------------------------------------------------------

ServerRoot "__APACHE_DIR__"
Listen __WEB_PORT__
ServerName localhost
PidFile "__DATA_DIR__\apache\httpd.pid"

ServerTokens Prod
ServerSignature Off
LogLevel warn
Timeout 300
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
EnableMMAP On
EnableSendfile On

LoadModule log_config_module modules/mod_log_config.so
LoadModule logio_module      modules/mod_logio.so
LoadModule env_module        modules/mod_env.so
LoadModule setenvif_module   modules/mod_setenvif.so
LoadModule headers_module    modules/mod_headers.so
LoadModule filter_module     modules/mod_filter.so
LoadModule deflate_module    modules/mod_deflate.so
LoadModule mime_module       modules/mod_mime.so
LoadModule dir_module        modules/mod_dir.so
LoadModule rewrite_module    modules/mod_rewrite.so
LoadModule alias_module      modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule negotiation_module modules/mod_negotiation.so

# --- PHP (mod_php, Thread Safe) ---
LoadModule php_module "__PHP_DIR__/php8apache2_4.dll"
PHPIniDir "__PHP_DIR__"

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-httpd-php .php
    AddType application/x-httpd-php-source .phps
    AddDefaultCharset UTF-8
</IfModule>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

DocumentRoot "__APP_DIR__\public"

<Directory "__APP_DIR__\public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory "__APP_DIR__">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Teruskan header Authorization (API token) ke PHP
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

ErrorLog "__DATA_DIR__\logs\apache-error.log"
CustomLog "__DATA_DIR__\logs\apache-access.log" combined

AcceptPathInfo On
