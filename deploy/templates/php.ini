; ---------------------------------------------------------------------------
; SmartPresensi - konfigurasi PHP 8.3 (Apache mod_php, Thread Safe x64)
; Nilai __*__ diganti otomatis oleh setup.ps1 saat instalasi.
; ---------------------------------------------------------------------------

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
max_execution_time = 300
max_input_time = 120
max_input_vars = 5000
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 0
error_log = "__DATA_DIR__\logs\php-error.log"
post_max_size = 32M
upload_max_filesize = 24M
max_file_uploads = 20
default_charset = "UTF-8"
default_mimetype = "text/html"
date.timezone = Asia/Jakarta

; Ekstensi wajib Laravel + aplikasi (semua dibundel pada folder ext/)
extension_dir = "ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=zip

; CA bundle untuk verifikasi TLS (cURL/OpenSSL). Disertakan di runtime\php.
curl.cainfo = "__PHP_DIR__\cacert.pem"
openssl.cafile = "__PHP_DIR__\cacert.pem"

[Session]
session.save_handler = files
session.save_path = "__DATA_DIR__\sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 86400

[opcache]
zend_extension=opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

[Date]
date.timezone = Asia/Jakarta

[MySQLi]
mysqli.default_port = 3306
