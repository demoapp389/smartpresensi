; ---------------------------------------------------------------------------
; SmartPresensi - MySQL 8.4 portable (tanpa instalasi)
; Nilai __*__ diganti otomatis oleh setup.ps1 saat instalasi.
; ---------------------------------------------------------------------------

[mysqld]
basedir = "__MYSQL_DIR__"
datadir = "__DATA_DIR__/mysql"
tmpdir  = "__DATA_DIR__/mysql-tmp"
port    = __DB_PORT__
bind-address = 127.0.0.1
mysqlx  = 0
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
max_connections = 200
max_allowed_packet = 64M
innodb_buffer_pool_size = 256M
innodb_flush_log_at_trx_commit = 2
sql_mode = STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
log-error = "__DATA_DIR__/logs/mysql-error.log"
slow_query_log = 0
explicit_defaults_for_timestamp = 1

[client]
port = __DB_PORT__
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
